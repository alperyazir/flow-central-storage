[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling — connections returned after each transaction
pool_mode = transaction
server_reset_query = DISCARD ALL

; Pool sizing
;
; These are PER (user, database) pair, and [databases] is a wildcard — so every
; database reached through this pooler gets its own pool of this size. Postgres
; runs with max_connections=100 (see docker-compose.yml), so the previous
; 100 + 10 reserve could not actually be opened: PgBouncer ran out of server
; connections, clients queued, and hit query_wait_timeout below.
; Budget: 40 + 5 reserve per pool, leaving headroom for a second database,
; migrations and admin sessions.
default_pool_size = 40
min_pool_size = 5
max_client_conn = 500
reserve_pool_size = 5
reserve_pool_timeout = 3

; Timeouts
server_idle_timeout = 300
server_lifetime = 3600
client_idle_timeout = 0
query_timeout = 120
query_wait_timeout = 15

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; Admin
admin_users = postgres
ignore_startup_parameters = extra_float_digits,options
