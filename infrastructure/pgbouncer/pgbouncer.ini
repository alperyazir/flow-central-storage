[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling — connections returned after each transaction
pool_mode = transaction
server_reset_query = DISCARD ALL

; Pool sizing. This file configures the local development stack; production
; generates its own copy from deployment/setup-server.sh in the flow-learn
; repo, so change both or they drift. The values below mirror production.
;
; default_pool_size is the number of server connections PgBouncer opens to
; Postgres, PER (user, database) pair. [databases] is a wildcard, so every
; database reached through this pooler gets its own pool of this size, and the
; sum has to fit inside Postgres max_connections (100, see docker-compose.yml).
; 50 + 5 reserve leaves ~45 for a second database, migrations and psql.
;
; The client side is the other half of the arithmetic: the API runs uvicorn
; with 4 workers, each with its own SQLAlchemy pool, so client connections are
; 4 x (FCS_DB_POOL_SIZE + FCS_DB_MAX_OVERFLOW). At 10+10 that is 80 clients
; sharing 50 server connections — fine under transaction pooling as long as
; transactions stay short, which is why auth must not hold one open.
default_pool_size = 50
min_pool_size = 5
max_client_conn = 500
reserve_pool_size = 5
reserve_pool_timeout = 3

; Timeouts
server_idle_timeout = 300
server_lifetime = 3600
client_idle_timeout = 0
query_timeout = 120
; Without this PgBouncer's default is 120s, so a saturated pool leaves requests
; hanging for two minutes before they fail. 15s surfaces the problem instead.
query_wait_timeout = 15

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; Admin
admin_users = postgres
ignore_startup_parameters = extra_float_digits,options
