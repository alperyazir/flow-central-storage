server {
    listen 80;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Allow very large file uploads (e.g., 4GB book archives, app builds)
    client_max_body_size 5G;

    # Increase timeouts for large file uploads
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Proxy all requests to the API service
    location / {
        # Handle CORS preflight requests directly in nginx
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Production generates its own nginx.conf from setup-server.sh in the
        # flow-learn repo; keep this fix in both.
        # Resolve `api` per request through Docker's embedded DNS instead of
        # once at startup. With a literal upstream, nginx caches the container
        # IP forever, so every redeploy that recreates the api container ends
        # in 502s until nginx is restarted by hand. Assigning the host to a
        # variable forces runtime resolution; $request_uri then has to be
        # appended explicitly, since nginx no longer rewrites the URI itself.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api;
        proxy_pass http://$api_upstream:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable request buffering for streaming large uploads
        # This streams data directly to backend without buffering entire request
        proxy_request_buffering off;

        # Disable response buffering for large downloads
        proxy_buffering off;

        # Forward Origin header to API (FastAPI handles CORS for actual requests)
        proxy_set_header Origin $http_origin;
    }
}
